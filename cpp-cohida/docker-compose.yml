version: '3.8'

services:
  cohida-app:
    build: .
    container_name: cpp-cohida
    env_file:
      - .env
    # Attach to the named production network and use its cohida-db alias.
    environment:
      DB_HOST: cohida-db
      DB_PORT: 5432
    volumes:
      - ./outputs:/app/outputs
      - ./.env:/app/.env:ro
    networks:
      - cohida-net

networks:
  cohida-net:
    external: true
    name: cohida-net