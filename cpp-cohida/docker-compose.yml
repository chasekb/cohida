version: '3.8'

services:
  cohida-app:
    build: .
    container_name: cpp-cohida
    env_file:
      - .env
    # db_prdnet is shared with the standalone Postgres stack, whose
    # stable network alias is postgres (not the prod compose service name db).
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
    volumes:
      - ./outputs:/app/outputs
      - ./.env:/app/.env:ro
    networks:
      - db_prdnet

networks:
  db_prdnet:
    external: true