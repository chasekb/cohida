version: '3.8'

services:
  # Test application
  test-app:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: cpp-cohida-test
    env_file:
      - .env.test
    # Attach to the named production network and use its cohida-db alias.
    environment:
      DB_HOST: cohida-db
      DB_PORT: 5432
    volumes:
      - ./test_outputs:/app/outputs
      # Mount .env.test to /app/.env.test so C++ config loader finds it
      - ./.env.test:/app/.env.test:ro
    networks:
      - cohida-net
    command: [ "./bin/cohida-unit-tests" ]

networks:
  cohida-net:
    external: true
    name: cohida-net
