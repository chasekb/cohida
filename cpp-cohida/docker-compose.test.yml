version: '3.8'

services:
  # Test application
  test-app:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: cpp-cohida-test
    env_file:
      - .env.test
    # db_prdnet is shared with the standalone Postgres stack, whose
    # stable network alias is postgres (not the production compose alias db).
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
    volumes:
      - ./test_outputs:/app/outputs
      # Mount .env.test to /app/.env.test so C++ config loader finds it
      - ./.env.test:/app/.env.test:ro
    networks:
      - db_prdnet
    command: [ "./bin/cohida-unit-tests" ]

networks:
  db_prdnet:
    external: true
