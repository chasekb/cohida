version: '3.8'

services:
  cohida-app:
    image: ghcr.io/chasekb/cohida:main
    container_name: cohida-app-prod
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    dns:
      - 1.1.1.1
    volumes:
      - ./outputs:/app/outputs
      - ./models:/app/models
    networks:
      cohida-net:
        aliases:
          - cohida-app
    restart: unless-stopped

  db:
    image: docker.io/library/postgres:15-alpine
    container_name: cohida-db-prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB_NAME:-cohida}
      POSTGRES_USER: ${POSTGRES_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_DB_PASSWORD:-postgres}
    ports:
      - "5435:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 60
    networks:
      cohida-net:
        aliases:
          - db
          - cohida-db-prod
    restart: unless-stopped

networks:
  cohida-net:
    driver: bridge
