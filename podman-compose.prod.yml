version: '3.8'

services:
  cohida-app:
    image: ghcr.io/chasekb/cohida:main
    container_name: cohida-app-prod
    env_file:
      - .env
    # Production uses the shared PostgreSQL service on db_prdnet.
    # Explicit values override stale host settings inherited from .env.
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      POSTGRES_DB_HOST: postgres
      POSTGRES_DB_PORT: 5432
    dns:
      - 1.1.1.1
    volumes:
      - ./outputs:/app/outputs
      - ./models:/app/models
    networks:
      db_prdnet:
        aliases:
          - cohida-app
    restart: unless-stopped

networks:
  db_prdnet:
    external: true
    name: db_prdnet
