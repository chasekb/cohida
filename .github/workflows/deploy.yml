name: Build and Publish cohida

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact source revision
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_SHA"
          printf 'exact_checkout_sha=%s\n' "$actual_sha"

      - name: Validate production database/network contract
        run: bash scripts/validate-production-contract.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,format=long
            type=raw,value=ci-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./cpp-cohida
          # Keep the required build/test gate native to the GitHub runner.
          # QEMU arm64 emulation previously left this job stalled before tests.
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Tests in Container
        run: |
          docker run --rm \
            -e COINBASE_API_KEY="dummy_key" \
            -e COINBASE_API_SECRET="dummy_secret" \
            -e COINBASE_API_PASSPHRASE="dummy_passphrase" \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ci-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }} /app/bin/cohida-unit-tests --gtest_filter=-*DatabaseManager*:*CoinbaseClientTest*:*DataRetrieverTest*
